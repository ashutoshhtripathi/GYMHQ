<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>

    <!-- Bolt Electric Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69f0ae" />
      <stop offset="40%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>

    <!-- Dumbbell Plate Metallic Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a3044" />
      <stop offset="50%" stop-color="#414a68" />
      <stop offset="100%" stop-color="#2a3044" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Emblem Base -->
  <polygon
    points="50,4 92,25 92,75 50,96 8,75 8,25"
    fill="url(#bgGrad)"
    stroke="url(#neonBorder)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Shield Inset -->
  <polygon
    points="50,11 86,29 86,71 50,89 14,71 14,29"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Athletic Dumbbell Weight Plates (Left & Right) -->
  <!-- Left Weight Plate -->
  <rect x="22" y="34" width="6" height="32" rx="2" fill="url(#plateGrad)" stroke="#00e676" stroke-width="0.8" opacity="0.85" />
  <rect x="29" y="39" width="4" height="22" rx="1.5" fill="url(#plateGrad)" opacity="0.7" />

  <!-- Right Weight Plate -->
  <rect x="72" y="34" width="6" height="32" rx="2" fill="url(#plateGrad)" stroke="#00b0ff" stroke-width="0.8" opacity="0.85" />
  <rect x="67" y="39" width="4" height="22" rx="1.5" fill="url(#plateGrad)" opacity="0.7" />

  <!-- Central Dumbbell Shaft Bar -->
  <rect x="33" y="47.5" width="34" height="5" rx="2.5" fill="#e0e0e0" opacity="0.4" />

  <!-- High-Energy Lightning Bolt Core -->
  <path
    d="M55 17 L35 48 L48 48 L42 83 L66 45 L52 45 Z"
    fill="url(#boltGrad)"
    stroke="#ffffff"
    stroke-width="0.8"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Power Core Diamond Accent -->
  <circle cx="50" cy="48" r="2.5" fill="#ffffff" />
</svg>
