version: '3.8'

services:
  # ============================================
  # 1. PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: gymhq_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymhq_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymhq_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gym_management}
    volumes:
      - gymhq_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymhq_admin} -d ${POSTGRES_DB:-gym_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gymhq_network

  # ============================================
  # 2. FastAPI Backend
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymhq_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gymhq_admin}:${POSTGRES_PASSWORD:-gymhq_secure_pass_2026}@db:5432/${POSTGRES_DB:-gym_management}
      SECRET_KEY: ${SECRET_KEY:-gymhq-production-secret-key-replace-in-env}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - gymhq_network

  # ============================================
  # 3. Frontend Web Application (Nginx + React)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gymhq_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - gymhq_network

# ============================================
# Networks & Persistent Volumes
# ============================================
networks:
  gymhq_network:
    driver: bridge

volumes:
  gymhq_pgdata:
    driver: local
